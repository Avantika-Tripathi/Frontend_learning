<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Mini Project: Profile Card </title>
    <link rel="stylesheet" href="css/styleCardProject.css">
</head>
<body>
    <header>
        <h1>Sisters</h1>
        <nav>
            <a href="#profile1">Ankita</a>
            <a href="#profile2">Avantika</a>
            <a href="#profile3">Anshika</a>
        </nav>
    </header>

    <main>
        <article id="profile1" class="card">
            <figure>
                <img src="image/bittu.png" alt="Ankita Tripathi" width="500" height="600" >
                <figcaption>Ankita Tripathi</figcaption>
            </figure>
            <p><q>I'm the eldest.</q></p>
        </article>
        <article id="profile2" class="card">
            <figure>
                <img src="image/avi.png" alt="Avantika Tripathi" width="500" height="600" >
                <figcaption>Avantika Tripathi</figcaption>
            </figure>
            <p><q>I'm the Middle child.</q></p>
        </article>
        <article id="profile3" class="card">
            <figure>
                <img src="image/mehak.png" alt="Anshika Tripathi" width="500" height="600" >
                <figcaption>Anshika Tripathi</figcaption>
            </figure>
            <p><q>I'm the youngest.</q></p>
        </article>
    </main>

   <footer>
    <p>&copy; Acme Co.</p>
   </footer>
</body>
</html>
