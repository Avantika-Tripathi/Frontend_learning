<!DOCTYPE html>
<html lang="en"> 
    <head>
        <title>Test login page for just html</title>
    </head>
    <main>
        <form action="/sign-up">
            <h1>Create Account</h1>
            <p>use your email for registration</p>
            <input type="text" placeholder="Name" required><br>
            <input type="text" placeholder="Email" required><br>
            <input type="text" placeholder="Password" required>
            <button type="submit">sign up</button>    
            <h1>Sign in</h1>
            <p>or use you account to login</p>
            <label for="Email"><input id=Email type="text" placeholder="Email" required></label>
            <label for="Password"><input id=Password type="text" placeholder="Password" required></label>
            <a href="https://forgotpassword" target="_blank">Forgot your password</a>
            <button type="submit">sign in</button>
        </form>
    </main>
</html>
