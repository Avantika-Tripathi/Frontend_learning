<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling Lists</title>
    <link rel="stylesheet" href="css/styleLists.css">
</head>
<body>
    <header>
        <h1>CSS Lists</h1>
    </header>
    <main>
        <article>
            <h2>Ordered List</h2>
            <ol start="3" reversed>
                <li>step uno</li>
                <li>step dos</li>
                <li>step tres</li>
            </ol>
        </article>
        <article>
            <h2>Unorder List</h2>
            <ul> 
                <li>step uno</li>
                <li>step dos</li>
                <li>step tres</li>
            </ul>
        </article>    
    </main>
    
</body>
</html>
